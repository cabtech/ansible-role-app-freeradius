---
- name: "Include variables wrapper"
  ansible.builtin.include_tasks:
    file: variables.yml
  tags: ["ct-freeradius"]

- name: "Disto/Family tasks (FF)"
  ansible.builtin.include_tasks:
    file: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
      - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
      - "{{ ansible_facts['distribution'] }}.yml"
      - "{{ ansible_facts['os_family'] }}.yml"
      - "default.yml"
  tags: ["ct-freeradius"]

- name: "Install package"
  ansible.builtin.apt:
    name: "{{ freeradius_pkgs }}"
    state: "{{ freeradius_state }}"
  become: true
  tags: ["ct-freeradius"]

- name: "Render proxy.conf"
  ansible.builtin.template:
    dest: "{{ freeradius_etc_dir }}/{{ freeradius_version }}/proxy.conf"
    mode: "0644"
    src: proxy.conf.j2
  notify: HandlerRestartFreeradius
  become: true
  tags: ["ct-freeradius"]

- name: "Render authorization file"
  ansible.builtin.template:
    dest: "{{ freeradius_etc_dir }}/{{ freeradius_version }}/mods-config/files/authorize"
    mode: "0644"
    src: authorize.j2
  notify: HandlerRestartFreeradius
  become: true
  tags: ["ct-freeradius"]
...
